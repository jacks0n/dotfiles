[mgr]
ratio = [1, 1, 6]  # Left: 12.5%, Center: 12.5%, Right: 75%

[preview]
max_width = 2000
max_height = 2000

[plugin]

prepend_preloaders = []

prepend_previewers = [
  # Directories with eza
  { mime = "inode/directory", run = 'piper -- eza --color=always --icons=always --git --group-directories-first --long "$1"' },

  # Markdown with glow
  { url = "*.md", run = 'piper -- glow --style=dark --width=$w "$1"' },
  { url = "*.markdown", run = 'piper -- glow --style=dark --width=$w "$1"' },

  # JSON with jq
  { url = "*.json", run = 'piper -- jq --color-output . "$1"' },
  { url = "*.jsonc", run = 'piper -- jq --color-output . "$1"' },
  { url = "*.json5", run = 'piper -- jq --color-output . "$1"' },

  # Code with bat
  { url = "*.py", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.pyi", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.pyx", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.js", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.jsx", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.ts", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.tsx", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.mjs", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.cjs", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.html", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.htm", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.css", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.scss", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.sass", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.vue", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.rs", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.go", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.c", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.cpp", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.cc", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.h", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.hpp", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.sh", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.bash", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.zsh", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.fish", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.toml", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.yaml", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.yml", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.ini", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.conf", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.lua", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.rb", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.php", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.java", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.kt", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },
  { url = "*.swift", run = 'piper -- bat --style=numbers,grid --color=always --wrap=never "$1"' },

  # Office documents
  { mime = "application/vnd.openxmlformats-officedocument.*", run = "office" },
  { mime = "application/vnd.oasis.opendocument.*", run = "office" },
  { mime = "application/vnd.ms-*", run = "office" },
  { mime = "application/msword", run = "office" },
  { url = "*.docx", run = "office" },
  { url = "*.xlsx", run = "office" },
  { url = "*.pptx", run = "office" },
  { url = "*.doc", run = "office" },
  { url = "*.xls", run = "office" },
  { url = "*.ppt", run = "office" },
  { url = "*.odt", run = "office" },
  { url = "*.ods", run = "office" },
  { url = "*.odp", run = "office" },
]
